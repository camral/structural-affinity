[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-affinity"
version = "0.2.0"
description = "Structural Affinity: An Algorithm for Coherent Cage-Based Shape Design"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["structural_affinity", "structural_affinity_torch"]
